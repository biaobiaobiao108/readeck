<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Readeck - 极简阅读志</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23b45309'><path d='M19 2H9c-1.1 0-2 .9-2 2v16l7-3 7 3V4c0-1.1-.9-2-2-2zm0 15.5l-5-2.18-5 2.18V4h10v13.5z'/></svg>" />
    <link rel="stylesheet" href="/index.css" />
    <script>
      (function() {
        const theme = localStorage.getItem('readeck_theme') || 'system';
        const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-paper-50 dark:bg-charcoal-950">
    <div id="root"></div>
    <script type="module" src="/index.js"></script>
  </body>
</html>
